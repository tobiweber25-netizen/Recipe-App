name: seasonal_prep_cook
description: A personal mobile application for weekly meal prep inspiration and consolidated grocery lists, optimized for South African seasonality.
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_dotenv: ^5.1.0
  google_generative_ai: ^0.4.0
  http: ^1.2.1
  share_plus: ^13.2.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
